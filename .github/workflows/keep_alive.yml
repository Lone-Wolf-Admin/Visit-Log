name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes to buffer against GitHub cron delays
  workflow_dispatch: # Allows manual testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: curl -fsSL --max-time 60 --retry 2 https://the-real-estate-matchmaker.onrender.com > /dev/null
